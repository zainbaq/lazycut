[project]
name = "lazycut-api"
version = "0.1.0"
description = "LazyCut API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlmodel>=0.0.22",
    "google-genai>=3.3",
    "anthropic>=2.8,<3",
    "ruamel.yaml>=0.18",
    "jinja2>=3.1",
    "httpx>=0.28",
    "pillow>=11",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
